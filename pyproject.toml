[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ytfakenews"
dynamic = ["version"]
description = "Transcribe YouTube videos and classify the transcript as REAL or FAKE news."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jumin Cho" }]
keywords = [
  "fake-news",
  "nlp",
  "speech-to-text",
  "text-classification",
  "tf-idf",
  "whisper",
  "youtube",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Speech-to-text. faster-whisper decodes audio with PyAV (no system ffmpeg, no torch).
# yt-dlp's "default" extra adds yt-dlp-ejs and "deno" a JavaScript runtime; recent
# yt-dlp releases need both for full YouTube support.
asr = [
  "faster-whisper>=1.1",
  "yt-dlp[default,deno]>=2026.1.29",
]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.0",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
ytfakenews = "ytfakenews.cli:main"

[project.urls]
Homepage = "https://github.com/jumincho/yt-fakenews-classifier"
Source = "https://github.com/jumincho/yt-fakenews-classifier"
Issues = "https://github.com/jumincho/yt-fakenews-classifier/issues"

[tool.hatch.version]
path = "src/ytfakenews/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ytfakenews"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RET", # flake8-return
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Word lists read better as "a b c".split() than as list literals.
"tests/**" = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["tests", "ytfakenews"]

[tool.mypy]
files = ["src/ytfakenews"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["faster_whisper.*", "joblib.*", "sklearn.*", "yt_dlp.*"]
ignore_missing_imports = true
